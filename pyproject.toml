# OddsPulse —— 预测市场数据源 + 分析框架
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odds-pulse"
version = "0.1.0"
description = "Polymarket / Kalshi 预测市场数据源 + 分析框架，含 LLM Agent 判断层"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["odds_pulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
